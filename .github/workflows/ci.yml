name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  ci:
    name: CI
    runs-on: xcode-27
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show
      - name: Test
        run: make test-ci
      - uses: laputa-systems/buildlib/setup@4ed2e0a1e0a5d23911ffccdd97349d30a7885f01 # v0.3.2
        with:
          tools: cpython
          lock: .github/tools.lock.json
      - name: Build differential binaries
        run: cargo build --release --locked --package gluon-meson --package gluon-ninja
      - name: Test upstream build parity
        run: bash tests/differential/run-macos.sh
