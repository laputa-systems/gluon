name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  ci:
    name: CI
    runs-on: xcode-27
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show
      - name: Test
        run: make test-ci
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Build differential binaries
        run: cargo build --release --locked --package gluon-meson --package gluon-ninja
      - name: Test upstream build parity
        run: bash tests/differential/run-macos.sh
